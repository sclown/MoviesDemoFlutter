name: movies_demo_flutter
description: A Flutter port of the SwiftUI MoviesDemo app — browse and search TMDB movies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# The modules of the app.
workspace:
  - packages/network_service
  - packages/movies_api
  - packages/movies_core
  - packages/movies_api_mocks
  - packages/movies_core_mocks
  - packages/movies
  - packages/search

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  movies:
    path: packages/movies
  movies_api:
    path: packages/movies_api
  movies_core:
    path: packages/movies_core
  network_service:
    path: packages/network_service
  search:
    path: packages/search

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  movies_api_mocks:
    path: packages/movies_api_mocks

flutter:
  uses-material-design: true
