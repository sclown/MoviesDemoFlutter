name: movies_demo_flutter
description: A Flutter port of the SwiftUI MoviesDemo app — browse and search TMDB movies.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# The modules of the app.
workspace:
  - packages/theme
  - packages/network_service
  - packages/movies_data
  - packages/movies_data_mocks
  - packages/movies
  - packages/search

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  movies:
    path: packages/movies
  movies_data:
    path: packages/movies_data
  network_service:
    path: packages/network_service
  theme:
    path: packages/theme
  search:
    path: packages/search
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  movies_data_mocks:
    path: packages/movies_data_mocks

flutter:
  uses-material-design: true
