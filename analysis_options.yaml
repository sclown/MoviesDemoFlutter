# Applies to the app and every package in the workspace.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated from the .arb files by `flutter gen-l10n`.
    - "packages/*/lib/src/l10n/generated/**"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_parenthesis
