name: main_navigation
description: Hosts the navigation stack and wires the feature modules together.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.8.1

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  movies:
    path: ../movies
  movies_api:
    path: ../movies_api
  movies_core:
    path: ../movies_core
  network_service:
    path: ../network_service
  search:
    path: ../search

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  movies_core_mocks:
    path: ../movies_core_mocks

flutter:
  uses-material-design: true
